<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1240" viewBox="0 0 1440 1240" role="img" aria-labelledby="title desc">
  <title id="title">RahulSite network architecture — current and proposed</title>
  <desc id="desc">Current App Service uses public Storage and Cosmos endpoints. A separate proposed design shows outbound VNet integration, a delegated app subnet, private endpoints in a data subnet, and private DNS. Proposed components are not deployed.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#167da5"/></marker>
    <marker id="plannedArrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#a76a15"/></marker>
    <g id="person"><circle cx="26" cy="26" r="26" fill="#0078d4"/><circle cx="26" cy="17" r="8" fill="white"/><path d="M11 40 Q11 26 26 26 Q41 26 41 40" fill="white"/></g>
    <g id="web"><circle cx="26" cy="26" r="24" fill="#e1f5fd" stroke="#009cce" stroke-width="3"/><ellipse cx="26" cy="26" rx="10" ry="24" fill="none" stroke="#009cce" stroke-width="2"/><path d="M3 26 H49 M8 13 H44 M8 39 H44" stroke="#009cce" stroke-width="2"/><path d="M34 30 L49 37 L34 44" fill="none" stroke="#0063a6" stroke-width="4"/></g>
    <g id="storage"><rect x="3" y="5" width="46" height="42" rx="4" fill="#e6eef2" stroke="#718793" stroke-width="2"/><path d="M7 10 H45 V18 H7Z" fill="#72b8db"/><path d="M7 23 H45 V31 H7Z M7 36 H45 V43 H7Z" fill="#a6cc48"/></g>
    <g id="cosmos"><ellipse cx="26" cy="26" rx="29" ry="10" transform="rotate(-30 26 26)" fill="none" stroke="#0078d4" stroke-width="3"/><circle cx="26" cy="26" r="17" fill="#54bee9"/><path d="M18 12 Q35 17 21 30 Q15 36 27 42" fill="none" stroke="#d6f4fb" stroke-width="6"/><path d="M46 1 L48 7 L54 9 L48 11 L46 17 L44 11 L38 9 L44 7Z" fill="#9bc52c"/></g>
    <g id="identity"><path d="M26 2 L50 27 L26 50 L2 27Z" fill="#42c6ef"/><path d="M26 2 V50 L50 27Z" fill="#0087ce"/><circle cx="38" cy="34" r="7" fill="#ffd44a"/><path d="M38 39 V52 M38 46 H44" stroke="#e9b300" stroke-width="4"/></g>
    <g id="network"><path d="M17 8 L2 26 L17 44 M35 8 L50 26 L35 44" fill="none" stroke="#27a7cd" stroke-width="3"/><circle cx="18" cy="26" r="3" fill="#86bb17"/><circle cx="26" cy="26" r="3" fill="#86bb17"/><circle cx="34" cy="26" r="3" fill="#86bb17"/></g>
    <g id="endpoint"><path d="M26 6 V26 L9 42 M26 26 L43 42" stroke="#329fcc" stroke-width="3" fill="none"/><circle cx="26" cy="6" r="5" fill="#329fcc"/><circle cx="9" cy="42" r="5" fill="#329fcc"/><circle cx="43" cy="42" r="5" fill="#329fcc"/><circle cx="26" cy="26" r="6" fill="#84bc12"/></g>
    <g id="pipeline"><rect x="3" y="4" width="46" height="44" rx="12" fill="#263b53"/><path d="M16 16 L25 26 L16 36 M29 35 H39" fill="none" stroke="white" stroke-width="3"/></g>
    <g id="dns"><circle cx="26" cy="26" r="24" fill="#0078d4"/><text x="26" y="31" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="white">DNS</text></g>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#20374e;font-size:14px}
      .heading{font-size:28px;font-weight:700;fill:#12334f}.section{font-size:19px;font-weight:700}.label{font-weight:600;font-size:16px}.small{font-size:12px;fill:#536c80}.tag{font-size:11px;font-weight:700;letter-spacing:1px}.boundary{fill:#f8fbfe;stroke:#a8bdcd;stroke-width:1.5;stroke-dasharray:8 6}.card{fill:white;stroke:#cbdce9;stroke-width:1.4}.edge{fill:none;stroke:#167da5;stroke-width:1.7;marker-end:url(#arrow)}.planned{fill:none;stroke:#a76a15;stroke-width:1.7;stroke-dasharray:6 4;marker-end:url(#plannedArrow)}
    </style>
  </defs>
  <rect width="1440" height="1240" fill="#fff"/>
  <rect width="1440" height="8" fill="#0078d4"/>
  <text x="40" y="54" class="heading">RahulSite | Network architecture</text>
  <text x="40" y="80" class="small">Subscription: Rahultest • Resource group: Rahulsite • Region: South India • Resource snapshot: 16 September 2026</text>
  <rect x="40" y="106" width="1360" height="440" rx="14" fill="#f7fbff" stroke="#d3e3ee"/>
  <text x="62" y="141" class="section">01  Current application &amp; data flow</text>
  <rect x="1165" y="122" width="210" height="25" rx="12" fill="#e4f4e9"/><text x="1270" y="139" text-anchor="middle" class="tag" fill="#277340">EXISTING RESOURCES</text>
  <rect x="272" y="166" width="1100" height="308" rx="6" class="boundary"/>
  <text x="288" y="189" class="small">Azure resource group: Rahulsite — logical boundary, not a VNet</text>
  <use href="#person" x="112" y="222"/><text x="138" y="297" text-anchor="middle" class="label">Visitors / Admin</text>
  <use href="#pipeline" x="112" y="360"/><text x="138" y="428" text-anchor="middle" class="label">GitHub Actions</text>
  <text x="138" y="448" text-anchor="middle" class="small">rahulsite • main</text>
  <rect x="380" y="233" width="340" height="207" rx="9" class="card"/>
  <use href="#web" x="400" y="253"/><text x="468" y="276" class="label">RahulSite</text>
  <text x="468" y="299">Azure App Service • Linux</text>
  <text x="400" y="333">Next.js frontend + admin + API routes</text>
  <text x="400" y="360" class="small">HTTPS-only public ingress • Node 24 LTS</text>
  <text x="400" y="385" class="small">System-assigned managed identity enabled</text>
  <text x="400" y="410" class="small">Data access currently uses connection strings</text>
  <rect x="1010" y="213" width="330" height="106" rx="9" class="card"/><use href="#storage" x="1026" y="231"/>
  <text x="1090" y="245" class="label">rahulsitefiles</text><text x="1090" y="269">Blob Storage • uploads</text><text x="1090" y="292" class="small">LRS • private container • TLS 1.2</text>
  <rect x="1010" y="344" width="330" height="108" rx="9" class="card"/><use href="#cosmos" x="1026" y="365"/>
  <text x="1090" y="378" class="label">rahulsitecosmos</text><text x="1090" y="402">Cosmos DB for MongoDB</text><text x="1090" y="427" class="small">Free tier • rahultech_prod</text>
  <use href="#identity" x="783" y="178"/><text x="847" y="197" class="label">Microsoft Entra ID</text><text x="847" y="218" class="small">NextAuth Microsoft sign-in</text>
  <path d="M170 247 H380" class="edge"/><text x="223" y="235" class="small">HTTPS 443</text>
  <path d="M170 385 H380" class="edge"/><text x="209" y="373" class="small">CI/CD (pending verification)</text>
  <path d="M650 233 V204 H779" class="edge"/><text x="658" y="194" class="small">OAuth / OIDC</text>
  <path d="M720 279 H1010" class="edge"/><text x="755" y="264" class="small">Upload media • HTTPS / Blob SDK</text>
  <path d="M720 394 H1010" class="edge"/><text x="755" y="379" class="small">CMS reads / writes • MongoDB + TLS</text>
  <text x="62" y="505">Public service endpoints are used. Private container ≠ private network endpoint.</text>
  <text x="62" y="527" class="small">VNet integration, private endpoints, private DNS and inbound IP allocation have not been verified. No Azure Functions are required.</text>

  <rect x="40" y="570" width="1360" height="550" rx="14" fill="#fffdf8" stroke="#e4d2ac"/>
  <text x="62" y="606" class="section">02  Proposed private-network design</text>
  <rect x="1120" y="586" width="255" height="25" rx="12" fill="#fff0d2"/><text x="1247" y="603" text-anchor="middle" class="tag" fill="#935a00">PROPOSED — NOT DEPLOYED</text>
  <rect x="340" y="640" width="670" height="372" rx="6" fill="#fffefb" stroke="#b6a681" stroke-width="1.5" stroke-dasharray="8 5"/>
  <use href="#network" x="354" y="652" transform="translate(142 262) scale(.6)"/>
  <text x="399" y="672" class="label">vnet-rahulsite • 10.0.0.0/16 (example)</text>
  <rect x="368" y="697" width="262" height="183" class="boundary"/>
  <text x="387" y="724" class="label">App integration subnet</text><text x="387" y="746">10.0.1.0/24 (proposed)</text>
  <use href="#network" x="390" y="765"/><text x="451" y="786" class="small">Delegated to</text><text x="451" y="806" class="small">Microsoft.Web/</text><text x="451" y="825" class="small">serverFarms</text>
  <text x="387" y="859" class="small">Outbound VNet integration only</text>
  <rect x="684" y="697" width="295" height="183" class="boundary"/>
  <text x="702" y="724" class="label">Private endpoint subnet</text><text x="702" y="746">10.0.2.0/24 (proposed)</text>
  <use href="#endpoint" x="704" y="770"/><text x="770" y="788">Blob private endpoint</text><text x="770" y="814">Mongo private endpoint</text>
  <text x="702" y="859" class="small">Private IPs allocated on deployment</text>
  <rect x="74" y="705" width="230" height="157" rx="9" class="card"/><use href="#web" x="91" y="723"/>
  <text x="154" y="747" class="label">RahulSite</text><text x="91" y="800">App Service (PaaS)</text><text x="91" y="827" class="small">Public HTTPS ingress retained</text>
  <path d="M304 781 H368" class="planned"/>
  <path d="M630 784 H684" class="planned"/>
  <rect x="1060" y="697" width="307" height="83" rx="8" class="card"/><use href="#storage" x="1074" y="708"/><text x="1137" y="730" class="label">rahulsitefiles</text><text x="1137" y="754" class="small">PaaS service outside the VNet</text>
  <rect x="1060" y="806" width="307" height="84" rx="8" class="card"/><use href="#cosmos" x="1074" y="821"/><text x="1137" y="841" class="label">rahulsitecosmos</text><text x="1137" y="865" class="small">PaaS service outside the VNet</text>
  <path d="M979 774 H1022 V739 H1060" class="planned"/><path d="M979 805 H1022 V849 H1060" class="planned"/>
  <use href="#dns" x="388" y="913"/><text x="453" y="927" class="label">Private DNS zones linked to VNet</text>
  <text x="453" y="951" class="small">privatelink.blob.core.windows.net</text><text x="453" y="973" class="small">privatelink.mongo.cosmos.azure.com</text>
  <text x="75" y="918" class="small">App Service is not hosted</text><text x="75" y="938" class="small">inside the integration subnet.</text>
  <text x="1060" y="935" class="small">Disable public data access only</text><text x="1060" y="955" class="small">after private DNS + connectivity</text><text x="1060" y="975" class="small">are validated end-to-end.</text>
  <text x="62" y="1044">Design prerequisites: confirm App Service plan support, address-space availability, RBAC and private endpoint costs.</text>
  <text x="62" y="1070" class="small">The CIDRs above are design examples, not allocated IP ranges. Private networking does not replace application authentication.</text>
  <text x="62" y="1093" class="small">No separate FastAPI app, Azure OpenAI, Functions or vector-search pipeline is included: these are not RahulSite components.</text>

  <path d="M44 1160 H103" class="edge"/><text x="116" y="1165" class="small">Current application flow (runtime validation pending)</text>
  <path d="M563 1160 H621" class="planned"/><text x="635" y="1165" class="small">Proposed network connection</text>
  <text x="40" y="1211" class="small">Schematic service icons • No secrets included • Documentation only — no Azure resources created or modified</text>
</svg>