<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
  <title id="title">RahulSite | Sign in, upload, publish and read — TARGET sequence</title>
  <desc id="desc">Target sequence using existing Next.js 16 App Service, NextAuth Entra identity, private Blob uploads and Cosmos MongoDB. Proposed route validation, publishing and public database reads are not all implemented. Failure paths include unauthorized access, rejected uploads, upload failure and orphan reconciliation after database failure.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#0078d4"/></marker>
    <marker id="reply" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#008577"/></marker>
    <g id="person"><circle cx="20" cy="12" r="9" fill="#0078d4"/><path d="M3 39Q3 24 20 24Q37 24 37 39Z" fill="#0078d4"/></g>
    <g id="app"><rect x="1" y="3" width="40" height="34" rx="5" fill="#e2f2ff" stroke="#0078d4" stroke-width="2"/><path d="M2 12H40M12 20L7 25L12 30M29 20L34 25L29 30" fill="none" stroke="#0078d4" stroke-width="2"/></g>
    <g id="shield"><path d="M21 2L39 9V22Q37 34 21 41Q5 34 3 22V9Z" fill="#dff5ef" stroke="#008577" stroke-width="2"/><path d="M12 21L19 28L31 15" fill="none" stroke="#008577" stroke-width="3"/></g>
    <g id="blob"><rect x="2" y="4" width="38" height="34" rx="5" fill="#e2f2ff" stroke="#0078d4" stroke-width="2"/><path d="M8 14H34M8 24H34" stroke="#0078d4" stroke-width="4"/></g>
    <g id="db"><path d="M3 10V32C3 43 39 43 39 32V10" fill="#dff5ef" stroke="#008577" stroke-width="2"/><ellipse cx="21" cy="10" rx="18" ry="7" fill="#dff5ef" stroke="#008577" stroke-width="2"/><path d="M3 23C3 34 39 34 39 23" fill="none" stroke="#008577" stroke-width="2"/></g>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;font-size:15px;fill:#20374e}.title{font-size:30px;font-weight:700;fill:#12334f}.section{font-size:18px;font-weight:700}.label{font-size:16px;font-weight:600}.small{font-size:13px;fill:#536c80}.tag{font-size:12px;font-weight:700;letter-spacing:1px}.card{fill:#fff;stroke:#cbdce9;stroke-width:1.5}.life{stroke:#b6ccdc;stroke-width:1.5;stroke-dasharray:5 7}.request{fill:none;stroke:#0078d4;stroke-width:2;marker-end:url(#arrow)}.reply{fill:none;stroke:#008577;stroke-width:2;stroke-dasharray:6 4;marker-end:url(#reply)}.note{fill:#fff9ee;stroke:#ddc69d;stroke-width:1.3}
    </style>
  </defs>
  <rect width="1600" height="1600" fill="#fff"/><rect width="1600" height="8" fill="#0078d4"/>
  <text x="40" y="55" class="title">RahulSite | From sign-in to published content</text>
  <rect x="1220" y="29" width="340" height="32" rx="16" fill="#fff0d2"/><text x="1390" y="50" text-anchor="middle" class="tag">TARGET FLOW — NOT ALL IMPLEMENTED</text>
  <text x="40" y="86" class="small">EXISTING: NextAuth Entra SSO + proxy admin protection. GAP: CRUD route validation; public pages currently use fixtures, not Cosmos.</text>
  <rect x="40" y="113" width="1520" height="120" rx="14" fill="#f4f9fd"/>
  <use href="#person" x="139" y="128"/><text x="160" y="193" text-anchor="middle" class="label">Browser</text><text x="160" y="214" text-anchor="middle" class="small">Admin, then visitor</text>
  <use href="#app" x="549" y="128"/><text x="570" y="193" text-anchor="middle" class="label">RahulSite • Next.js 16</text><text x="570" y="214" text-anchor="middle" class="small">App Service / server routes</text>
  <use href="#shield" x="869" y="128"/><text x="890" y="193" text-anchor="middle" class="label">NextAuth / Entra ID</text><text x="890" y="214" text-anchor="middle" class="small">Existing identity integration</text>
  <use href="#blob" x="1139" y="128"/><text x="1160" y="193" text-anchor="middle" class="label">rahulsitefiles</text><text x="1160" y="214" text-anchor="middle" class="small">Private uploads container</text>
  <use href="#db" x="1409" y="128"/><text x="1430" y="193" text-anchor="middle" class="label">rahulsitecosmos</text><text x="1430" y="214" text-anchor="middle" class="small">Cosmos DB for MongoDB</text>
  <path d="M160 235V1270M570 235V1270M890 235V1270M1160 235V1270M1430 235V1270" class="life"/>
  <rect x="40" y="246" width="1520" height="32" rx="8" fill="#eaf3ff"/><text x="56" y="268" class="section">01  Authenticate • existing SSO, target per-route authorization</text>
  <path d="M160 320H570" class="request"/><text x="180" y="309">1  Admin opens sign-in</text>
  <path d="M570 369H890" class="request"/><text x="589" y="358">2  OIDC redirect / callback</text>
  <path d="M890 418H570" class="reply"/><text x="589" y="407">3  Verify identity; establish session</text>
  <path d="M570 467H160" class="reply"/><text x="180" y="456">4  Authenticated admin session</text>
  <rect x="1010" y="303" width="525" height="141" rx="10" class="note"/><text x="1030" y="331" class="label">TARGET gate on every mutation</text><text x="1030" y="357">Verify session + admin permission at the route.</text><text x="1030" y="382">Missing / invalid session → 401; denied role → 403.</text><text x="1030" y="409" class="small">Stop before data access. Proxy alone is not the full control.</text>
  <rect x="40" y="494" width="1520" height="32" rx="8" fill="#eaf3ff"/><text x="56" y="516" class="section">02  Upload &amp; publish • TARGET validation and persistence contract</text>
  <path d="M160 566H570" class="request"/><text x="180" y="555">5  Submit upload with session</text>
  <path d="M570 594H627V634H570" class="request"/><text x="643" y="613">6  Validate size, type / bytes, safe generated key</text><text x="643" y="634" class="small">Reject invalid upload (4xx); do not write Blob or Cosmos</text>
  <path d="M570 682H1160" class="request"/><text x="594" y="671">7  Valid upload → private Blob write over HTTPS</text>
  <path d="M1160 731H570" class="reply"/><text x="594" y="720">8  Blob success → staged asset key (not yet published)</text>
  <path d="M570 780H160" class="reply"/><text x="180" y="769">9  Return staged asset reference</text>
  <path d="M160 829H570" class="request"/><text x="180" y="818">10  Save / publish content + asset key</text>
  <path d="M570 854H627V894H570" class="request"/><text x="643" y="874">11  Re-authorize; validate schema, asset ownership, publish rules</text>
  <path d="M570 938H1430" class="request"/><text x="594" y="927">12  Save validated content + publication state to Cosmos (MongoDB + TLS)</text>
  <path d="M1430 987H570" class="reply"/><text x="594" y="976">13  Acknowledged DB success — only then confirm publish</text>
  <path d="M570 1036H160" class="reply"/><text x="180" y="1025">14  Show saved / published confirmation</text>
  <rect x="40" y="1060" width="1520" height="32" rx="8" fill="#e5f5f1"/><text x="56" y="1082" class="section">03  Read published content • TARGET replaces current public fixtures</text>
  <path d="M160 1132H570" class="request"/><text x="180" y="1121">15  Visitor requests page</text>
  <path d="M570 1177H1430" class="request"/><text x="594" y="1166">16  Server query: published only; exclude drafts (including direct slug reads)</text>
  <path d="M1430 1222H570" class="reply"/><text x="594" y="1211">17  Published results / no match / database error</text>
  <path d="M570 1267H160" class="reply"/><text x="180" y="1256">18  Page / 404 / empty / unavailable</text>
  <rect x="40" y="1293" width="1520" height="202" rx="14" fill="#fff9f6" stroke="#e8c4b6"/>
  <text x="60" y="1324" class="section">Failure branches • TARGET handling, not a cross-service transaction</text>
  <text x="60" y="1356" class="label">Unauthorized / rejected upload</text><text x="60" y="1382">Steps 5–6 / 10–11: 401, 403 or validation 4xx.</text><text x="60" y="1406">Stop; no new data write on rejected requests.</text><text x="60" y="1440" class="small">Blob failure at step 7: return upload failure;</text><text x="60" y="1461" class="small">do not save content referencing a missing object.</text>
  <path d="M550 1340V1473M1070 1340V1473" stroke="#e8c4b6"/>
  <text x="574" y="1356" class="label">Blob succeeded, DB save failed</text><text x="574" y="1382">Return save error; never claim publication.</text><text x="574" y="1406">Staged Blob can become an orphan.</text><text x="574" y="1440" class="small">Reconcile ambiguous DB outcomes before deletion;</text><text x="574" y="1461" class="small">delete only confirmed unreferenced staged assets.</text>
  <text x="1094" y="1356" class="label">Compensation / recovery</text><text x="1094" y="1382">Server → Blob: safe cleanup over HTTPS.</text><text x="1094" y="1406">Cleanup failure → record + retry reconciliation.</text><text x="1094" y="1440" class="small">Also expire abandoned staged uploads safely.</text><text x="1094" y="1461" class="small">Read failure → unavailable, never fabricated content.</text>
  <path d="M40 1531H105" class="request"/><text x="118" y="1536" class="small">Request / processing</text><path d="M345 1531H410" class="reply"/><text x="423" y="1536" class="small">Response</text><rect x="620" y="1517" width="26" height="22" rx="4" class="note"/><text x="658" y="1536" class="small">Required target control / failure branch</text>
  <text x="40" y="1576" class="small">Arrows describe the target contract, not implementation status. Private media delivery is detailed in security.svg. Documentation only • no cloud changes.</text>
</svg>