<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1440" viewBox="0 0 1600 1440" role="img" aria-labelledby="title desc">
  <title id="title">RahulSite | Trust boundaries and security controls</title>
  <desc id="desc">Existing NextAuth Entra SSO and proxy admin protection are separated from target route authorization, runtime validation and a controlled published-asset server proxy. Browser inputs are untrusted. Server-only credentials access private Blob uploads and Cosmos over TLS. GitHub Actions uses azure/login OIDC for deployment, not a PAT on the Azure runtime. Private networking remains proposed.</desc>
  <defs>
    <marker id="existing" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#0078d4"/></marker>
    <marker id="target" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#008577"/></marker>
    <g id="browser"><rect x="2" y="4" width="50" height="38" rx="5" fill="#e2f2ff" stroke="#0078d4" stroke-width="2"/><path d="M2 15H52" stroke="#0078d4" stroke-width="2"/><circle cx="10" cy="10" r="2" fill="#0078d4"/><circle cx="17" cy="10" r="2" fill="#0078d4"/></g>
    <g id="shield"><path d="M27 2L49 10V26Q46 41 27 48Q8 41 5 26V10Z" fill="#dff5ef" stroke="#008577" stroke-width="2"/><path d="M15 25L24 34L39 17" fill="none" stroke="#008577" stroke-width="3"/></g>
    <g id="lock"><rect x="10" y="21" width="34" height="25" rx="5" fill="#0078d4"/><path d="M17 21V13A10 10 0 0 1 37 13V21" fill="none" stroke="#0078d4" stroke-width="4"/><circle cx="27" cy="31" r="3" fill="#fff"/><path d="M27 33V38" stroke="#fff" stroke-width="2"/></g>
    <g id="db"><path d="M5 12V38C5 50 49 50 49 38V12" fill="#e2f2ff" stroke="#0078d4" stroke-width="2"/><ellipse cx="27" cy="12" rx="22" ry="8" fill="#e2f2ff" stroke="#0078d4" stroke-width="2"/><path d="M5 26C5 38 49 38 49 26" fill="none" stroke="#0078d4" stroke-width="2"/></g>
    <g id="terminal"><rect x="2" y="4" width="50" height="40" rx="8" fill="#12334f"/><path d="M12 14L22 24L12 34M29 34H43" stroke="#fff" stroke-width="3" fill="none"/></g>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;font-size:15px;fill:#20374e}.title{font-size:30px;font-weight:700;fill:#12334f}.section{font-size:20px;font-weight:700}.label{font-size:17px;font-weight:600}.small{font-size:13px;fill:#536c80}.tag{font-size:12px;font-weight:700;letter-spacing:1px}.card{fill:#fff;stroke:#bfd5e4;stroke-width:1.5}.planned{fill:#f3fcf8;stroke:#008577;stroke-width:1.5;stroke-dasharray:7 5}.edge{fill:none;stroke:#0078d4;stroke-width:2;marker-end:url(#existing)}.target{fill:none;stroke:#008577;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#target)}
    </style>
  </defs>
  <rect width="1600" height="1440" fill="#fff"/><rect width="1600" height="8" fill="#0078d4"/>
  <text x="40" y="55" class="title">RahulSite | Trust boundaries &amp; security posture</text>
  <rect x="1220" y="29" width="340" height="32" rx="16" fill="#fff0d2"/><text x="1390" y="50" text-anchor="middle" class="tag">EXISTING + TARGET • NOT AN AUDIT</text>
  <text x="40" y="87" class="small">Documentation of known components and proposed controls. Dashed teal elements are TARGET requirements, not claims of deployed protection.</text>
  <rect x="40" y="120" width="300" height="850" rx="16" fill="#fff8f3" stroke="#d3ac90" stroke-dasharray="8 6"/>
  <text x="62" y="154" class="section">01  Untrusted browser</text>
  <use href="#browser" x="162" y="201"/><text x="190" y="281" text-anchor="middle" class="label">Visitor / admin</text>
  <text x="62" y="329">Treat all input as untrusted:</text><text x="62" y="361" class="small">• Requests, form fields and uploads</text><text x="62" y="388" class="small">• Asset keys and publication flags</text><text x="62" y="415" class="small">• Client-side role / validation claims</text>
  <rect x="62" y="476" width="256" height="121" rx="10" fill="#fff" stroke="#e1c8b6"/><text x="80" y="508" class="label">No server credentials</text><text x="80" y="537" class="small">No connection strings or secrets</text><text x="80" y="562" class="small">in browser bundles or responses.</text>
  <text x="62" y="743" class="label">No direct Blob delivery</text><text x="62" y="773" class="small">Private uploads are not public URLs.</text><text x="62" y="798" class="small">TARGET: fetch media via server;</text><text x="62" y="823" class="small">only assets of published content.</text>
  <text x="62" y="916" class="small">Trust boundary ≠ network isolation</text>
  <rect x="410" y="120" width="750" height="850" rx="16" fill="#f6faff" stroke="#8eb4d0" stroke-dasharray="8 6"/>
  <text x="434" y="154" class="section">02  RahulSite • Next.js 16 App Service / server</text>
  <rect x="445" y="190" width="680" height="145" rx="12" class="card"/><use href="#shield" x="465" y="214"/>
  <text x="536" y="221" class="tag">EXISTING IDENTITY &amp; ADMIN PERIMETER</text><text x="536" y="252" class="label">NextAuth ↔ Microsoft Entra ID</text><text x="536" y="279">SSO identity establishes a session; proxy protects admin paths.</text><text x="536" y="308" class="small">Identity provider is external; shown here as an integration, not hosted in the app.</text>
  <path d="M340 238H445" class="edge"/><text x="350" y="210" class="small">HTTPS</text><text x="350" y="227" class="small">SSO</text>
  <path d="M785 335V389" class="target"/><text x="800" y="365" class="small">Verify on each route, not just at sign-in</text>
  <rect x="445" y="390" width="680" height="166" rx="12" class="planned"/><text x="467" y="422" class="tag">TARGET • ROUTE-LEVEL CONTROLS / KNOWN GAPS</text>
  <text x="467" y="453" class="label">Session + admin authorization before any admin data access</text><text x="467" y="482">Runtime schemas for CRUD; safe upload size / type / content checks.</text><text x="467" y="509">Reject invalid input; validate asset ownership and publication state.</text><text x="467" y="536" class="small">CRUD currently lacks route-level runtime validation; proxy is not a substitute.</text>
  <path d="M340 447H445" class="target"/><text x="350" y="435" class="small">Requests</text>
  <rect x="445" y="620" width="680" height="149" rx="12" class="planned"/><text x="467" y="650" class="tag">TARGET • CONTROLLED PUBLIC ASSET SERVER PROXY</text><text x="467" y="681" class="label">Resolve asset key against a published-content allowlist</text><text x="467" y="708">Read publication state in Cosmos → fetch allowed Blob → stream bytes.</text><text x="467" y="737" class="small">Deny unknown / draft assets; no arbitrary URL fetch; fail closed on lookup errors.</text>
  <path d="M445 684H340" class="target"/><text x="350" y="655" class="small">HTTPS</text><text x="350" y="672" class="small">media*</text>
  <path d="M1080 620V587H1200V497H1240" class="target"/><text x="880" y="579" class="small">Published-asset lookup • TLS</text>
  <rect x="445" y="810" width="680" height="124" rx="12" class="card"/><use href="#lock" x="465" y="842"/><text x="536" y="841" class="tag">SERVER-ONLY CREDENTIAL REFERENCES</text><text x="536" y="870">Storage / Cosmos connection strings; NextAuth / Entra secrets.</text><text x="536" y="895" class="small">Resolve on server; redact from logs. No secret values shown in these diagrams.</text><text x="536" y="918" class="small">Managed identity is enabled; current data access still uses connection strings.</text>
  <rect x="1230" y="120" width="330" height="850" rx="16" fill="#f5fafc" stroke="#b4cbd7"/>
  <text x="1252" y="154" class="section">03  Data services</text><text x="1252" y="184" class="small">Current public service endpoints</text><text x="1252" y="210" class="small">TLS ≠ private network connectivity</text>
  <rect x="1240" y="390" width="310" height="166" rx="12" class="card"/><use href="#db" x="1260" y="411"/><text x="1324" y="439" class="label">rahulsitecosmos</text><text x="1260" y="486">Cosmos DB for MongoDB</text><text x="1260" y="513" class="small">CMS data + publication state</text><text x="1260" y="537" class="small">TARGET public reads exclude drafts</text>
  <path d="M1125 446H1240" class="edge"/><text x="1138" y="416" class="small">MongoDB</text><text x="1138" y="434" class="small">+ TLS</text>
  <rect x="1240" y="620" width="310" height="149" rx="12" class="card"/><use href="#lock" x="1260" y="638"/><text x="1324" y="669" class="label">rahulsitefiles</text><text x="1260" y="711">Blob • private uploads container</text><text x="1260" y="741" class="small">No anonymous container access</text>
  <path d="M1125 683H1240" class="target"/><text x="1137" y="657" class="small">HTTPS</text><text x="1137" y="675" class="small">fetch*</text>
  <text x="1252" y="833" class="label">VNet / private endpoints</text><text x="1252" y="863" class="small">Proposed, not deployed in this design.</text><text x="1252" y="890" class="small">See network.svg for subnet / DNS plan.</text><text x="1252" y="927" class="small">*Request / response path summarized</text>
  <rect x="40" y="996" width="1520" height="244" rx="16" fill="#f6f8fc" stroke="#b4cbd7"/>
  <text x="62" y="1033" class="section">04  Deployment identity • separate from browser SSO and runtime data credentials</text>
  <rect x="62" y="1060" width="340" height="97" rx="12" class="card"/><use href="#terminal" x="79" y="1082"/><text x="148" y="1095" class="label">GitHub Actions</text><text x="148" y="1124">EXISTING workflow: azure/login</text>
  <path d="M402 1110H588" class="edge"/><text x="422" y="1083" class="small">GitHub OIDC assertion</text><text x="422" y="1100" class="small">Federated token exchange</text>
  <rect x="588" y="1060" width="395" height="97" rx="12" class="card"/><text x="610" y="1095" class="label">Microsoft Entra / Azure control plane</text><text x="610" y="1124">Short-lived deployment access token</text>
  <path d="M983 1110H1190" class="edge"/><text x="1005" y="1097" class="small">Authorized deployment</text>
  <rect x="1190" y="1060" width="347" height="97" rx="12" class="card"/><text x="1212" y="1095" class="label">RahulSite App Service</text><text x="1212" y="1124">Receive built application artifact</text>
  <text x="62" y="1191">OIDC, not a GitHub PAT on the Azure runtime. Workflow configuration is not proof of a successful deployment.</text><text x="62" y="1217" class="small">Deployment federation does not replace app SSO or grant the browser access to server-only Storage / Cosmos credentials.</text>
  <rect x="40" y="1263" width="1520" height="69" rx="12" fill="#fff9ee" stroke="#ddc69d"/><text x="60" y="1291" class="label">Known application gap</text><text x="60" y="1316">Public pages still use fixtures, not Cosmos. Published-only reads, the media allowlist proxy, and complete route checks / validation are TARGET behavior.</text>
  <path d="M40 1370H102" class="edge"/><text x="116" y="1375" class="small">Existing integration / transport</text><path d="M425 1370H487" class="target"/><text x="501" y="1375" class="small">TARGET control / path</text><rect x="775" y="1357" width="38" height="25" fill="none" stroke="#8eb4d0" stroke-dasharray="5 4"/><text x="827" y="1375" class="small">Logical trust boundary, not a VNet</text>
  <text x="40" y="1417" class="small">Self-contained schematic icons • No secrets included • No cloud operations • Controls shown as TARGET require implementation and verification</text>
</svg>